  <path d="M175 120 Q200 142 225 120" stroke="#d9863a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- detective hat -->
  <ellipse cx="200" cy="110" rx="95" ry="16" fill="#6b4f3a"/>
