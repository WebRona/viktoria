  <path d="M142 172 L178 166" stroke="#2b1d1a" stroke-width="6" stroke-linecap="round"/>
  <!-- big eye behind magnifier -->
  <circle cx="255" cy="185" r="62" fill="#e9f6ff" stroke="#3b2a1f" stroke-width="10"/>
  <circle cx="255" cy="185" r="30" fill="#fff"/>
  <circle cx="258" cy="188" r="17" fill="#2b1d1a"/>
  <circle cx="264" cy="181" r="6" fill="#fff"/>
  <path d="M220 160 Q235 145 252 148" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".8"/>
  <rect x="300" y="232" width="20" height="80" rx="8" fill="#3b2a1f" transform="rotate(-38 310 272)"/>
  <!-- nose & mouth -->
  <path d="M192 215 L208 215 L200 225 Z" fill="#e0707c"/>
  <path d="M200 225 Q190 240 178 234 M200 225 Q210 240 222 234" stroke="#2b1d1a" stroke-width="4" fill="none" stroke-linecap="round"/>
